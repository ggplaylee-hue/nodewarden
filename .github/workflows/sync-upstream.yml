name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit hash or tag (leave blank to use latest upstream commit)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/shuaiplus/NodeWarden.git || true
          git fetch upstream --tags

      - name: Resolve target commit
        id: resolve
        run: |
          TRIGGER="${{ github.event_name }}"
          MANUAL_INPUT="${{ github.event.inputs.target_commit }}"

          if [ "$TRIGGER" = "schedule" ]; then
            LATEST_TAG=$(curl -s https://api.github.com/repos/shuaiplus/NodeWarden/releases/latest | jq -r .tag_name)
            if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
              echo "No release found in upstream."
              exit 1
            fi
            TARGET_SHA=$(git rev-list -n 1 "$LATEST_TAG" 2>/dev/null)
            if [ -z "$TARGET_SHA" ]; then
              echo "Tag '$LATEST_TAG' not found after fetch."
              exit 1
            fi
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            echo "Auto mode - latest release: $LATEST_TAG ($TARGET_SHA)"

          elif [ -n "$MANUAL_INPUT" ]; then
            TARGET_SHA=$(git rev-parse "$MANUAL_INPUT" 2>/dev/null)
            if [ -z "$TARGET_SHA" ]; then
              echo "Cannot resolve '$MANUAL_INPUT' to a commit."
              exit 1
            fi
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - target: $MANUAL_INPUT ($TARGET_SHA)"

          else
            TARGET_SHA=$(git rev-parse upstream/main)
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - latest upstream commit: $TARGET_SHA"
          fi

      - name: Check if update is needed
        id: check
        run: |
          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"

          if git merge-base --is-ancestor "$TARGET_SHA" HEAD 2>/dev/null; then
            echo "Already up to date with $TARGET_SHA - skipping."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update needed - target: $TARGET_SHA"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply update
        if: steps.check.outputs.needs_update == 'true'
        run: |
          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"
          WORKFLOW_FILE=".github/workflows/sync-upstream.yml"

          cp "$WORKFLOW_FILE" "$RUNNER_TEMP/sync-upstream.yml"
          git checkout main

          if ! git merge "$TARGET_SHA" --no-edit; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            OTHER_CONFLICTS="$(printf '%s\n' "$CONFLICTS" | grep -vxF "$WORKFLOW_FILE" || true)"

            if [ -n "$OTHER_CONFLICTS" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$CONFLICTS"
              exit 1
            fi

            if printf '%s\n' "$CONFLICTS" | grep -qxF "$WORKFLOW_FILE"; then
              echo "Keeping our $WORKFLOW_FILE"
              cp "$RUNNER_TEMP/sync-upstream.yml" "$WORKFLOW_FILE"
              git add "$WORKFLOW_FILE"
              git commit --no-edit
            else
              echo "Merge failed without an unresolved file."
              exit 1
            fi
          fi

          if ! cmp -s "$RUNNER_TEMP/sync-upstream.yml" "$WORKFLOW_FILE"; then
            echo "Restoring our $WORKFLOW_FILE"
            cp "$RUNNER_TEMP/sync-upstream.yml" "$WORKFLOW_FILE"
            git add "$WORKFLOW_FILE"
            git commit -m "chore: preserve sync-upstream workflow"
          fi

      - name: Push
        if: steps.check.outputs.needs_update == 'true'
        run: git push origin main

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.needs_update }}" = "true" ]; then
            echo "### Synced successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag:** ${{ steps.resolve.outputs.latest_tag || 'N/A (manual)' }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Commit:** \`${{ steps.resolve.outputs.target_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Nothing to update" >> "$GITHUB_STEP_SUMMARY"
          fi
